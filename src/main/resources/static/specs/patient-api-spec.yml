openapi: 3.0.3
info:
  title: Patient Service API
  version: 1.0.0
  description: API for managing patient medical records.
servers:
  - url: http://localhost:8080
    description: Local development server
tags:
  - name: Patient
    description: Patient management operations
paths:
  /api/v1/auth/patients/register:
    post:
      tags:
        - Patient
      operationId: registerPatient
      summary: Register a patient and create their account
      description: >
        Creates a patient account using the email address as the
        Keycloak username and stores the patient's profile.
      security: []

      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatientRegistrationRequest'

      responses:
        '201':
          description: Patient registered successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PatientResponse'

        '400':
          description: Invalid registration request

        '409':
          description: Email address is already registered

        '500':
          description: Internal server error

        '503':
          description: Identity provider is temporarily unavailable

components:
  schemas:

    PatientRegistrationRequest:
      type: object
      required:
        - firstName
        - lastName
        - dateOfBirth
        - gender
        - email
        - phone
        - password
        - termsAccepted
      properties:
        firstName:
          type: string
          minLength: 1
          maxLength: 100
          example: Jane
        middleName:
          type: string
          maxLength: 100
        lastName:
          type: string
          minLength: 1
          maxLength: 100
          example: Doe
        dateOfBirth:
          type: string
          format: date
          example: '1990-05-20'
        gender:
          $ref: '#/components/schemas/Gender'
        email:
          type: string
          format: email
          maxLength: 255
          example: jane.doe@example.com
          description: Also used as the Keycloak username.
        phone:
          type: string
          pattern: '^\+?[1-9][0-9]{6,14}$'
          example: '+14155552671'
        password:
          type: string
          format: password
          writeOnly: true
          minLength: 8
          maxLength: 64
          description: >
            Patient password. Sent to Keycloak for credential
            management. Never stored in the application database
            or returned in API responses.
        bloodGroup:
          $ref: '#/components/schemas/BloodGroup'
        address:
          $ref: '#/components/schemas/Address'
        emergencyContact:
          $ref: '#/components/schemas/EmergencyContact'
        termsAccepted:
          type: boolean
          enum: [true]
          description: Patient must accept the terms to register.
        isDeleted:
          type: boolean

    PatientResponse:
      type: object
      required:
        - id
        - patientNumber
        - firstName
        - lastName
        - dateOfBirth
        - gender
        - email
        - phone
        - createdAt
      properties:
        id:
          type: string
          format: uuid
        patientNumber:
          type: string
          description: Human-readable patient identification number.
          example: PAT-000123
        firstName:
          type: string
        middleName:
          type: string
        lastName:
          type: string
        dateOfBirth:
          type: string
          format: date
        gender:
          $ref: '#/components/schemas/Gender'
        email:
          type: string
          format: email
        phone:
          type: string
        bloodGroup:
          $ref: '#/components/schemas/BloodGroup'
        address:
          $ref: '#/components/schemas/Address'
        emergencyContact:
          $ref: '#/components/schemas/EmergencyContact'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
          nullable: true
    Gender:
      type: string
      enum:
        - MALE
        - FEMALE
        - OTHER
    BloodGroup:
      type: string
      enum:
        - A_POSITIVE
        - A_NEGATIVE
        - B_POSITIVE
        - B_NEGATIVE
        - AB_POSITIVE
        - AB_NEGATIVE
        - O_POSITIVE
        - O_NEGATIVE
    Address:
      type: object
      required:
        - addressLine1
        - city
        - country
      properties:
        addressLine1:
          type: string
          maxLength: 200
        addressLine2:
          type: string
          maxLength: 200
        city:
          type: string
          maxLength: 100
        state:
          type: string
          maxLength: 100
        postalCode:
          type: string
          maxLength: 20
        country:
          type: string
          maxLength: 100

    EmergencyContact:
      type: object
      required:
        - name
        - relationship
        - phone
      properties:
        name:
          type: string
          maxLength: 100
        relationship:
          type: string
          maxLength: 50
          example: Spouse
        phone:
          type: string
          pattern: '^\+?[1-9][0-9]{6,14}$'