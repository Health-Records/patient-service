openapi: 3.0.3
info:
  title: Patient Service API
  version: 1.0.0
  description: API for managing patient medical records.
servers:
  - url: http://localhost:8080
    description: Local development server
tags:
  - name: Patient
    description: Patient management operations
paths:
  /patients:
    get:
      tags:
        - Patient
      operationId: listPatients
      summary: List all patients
      responses:
        '200':
          description: Patients retrieved successfully
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PatientResponse'
        '500':
          $ref: '#/components/responses/InternalServerError'
    post:
      tags:
        - Patient
      operationId: createPatient
      summary: Create a patient
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatientRequest'
      responses:
        '201':
          description: Patient created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PatientResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /patients/{id}:
    parameters:
      - name: id
        in: path
        required: true
        description: Patient UUID
        schema:
          type: string
          format: uuid
    get:
      tags:
        - Patient
      operationId: getPatientById
      summary: Get a patient by ID
      responses:
        '200':
          description: Patient retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PatientResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
    put:
      tags:
        - Patient
      operationId: updatePatient
      summary: Update a patient
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatientRequest'
      responses:
        '200':
          description: Patient updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PatientResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
    delete:
      tags:
        - Patient
      operationId: deletePatient
      summary: Delete a patient
      responses:
        '200':
          description: Patient deleted successfully
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
components:
  responses:
    BadRequest:
      description: Invalid request data
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Patient not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    InternalServerError:
      description: Unexpected server error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  schemas:
    PatientRequest:
      type: object
      required:
        - name
        - dateOfBirth
        - gender
        - phone
        - email
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
          example: Jane Doe
        dateOfBirth:
          type: string
          format: date
          example: '1990-05-20'
        gender:
          type: string
          enum:
            - MALE
            - FEMALE
            - OTHER
          example: FEMALE
        phone:
          type: string
          pattern: '^\+?[1-9][0-9]{6,14}$'
          example: '+14155552671'
        email:
          type: string
          format: email
          maxLength: 255
          example: jane.doe@example.com
    PatientResponse:
      type: object
      required:
        - id
        - name
        - dateOfBirth
        - gender
        - phone
        - email
      properties:
        id:
          type: string
          format: uuid
          example: 3fa85f64-5717-4562-b3fc-2c963f66afa6
        name:
          type: string
          minLength: 1
          maxLength: 100
          example: Jane Doe
        dateOfBirth:
          type: string
          format: date
          example: '1990-05-20'
        gender:
          type: string
          enum:
            - MALE
            - FEMALE
            - OTHER
          example: FEMALE
        phone:
          type: string
          pattern: '^\+?[1-9][0-9]{6,14}$'
          example: '+14155552671'
        email:
          type: string
          format: email
          maxLength: 255
          example: jane.doe@example.com
    ErrorResponse:
      type: object
      required:
        - timestamp
        - status
        - error
        - message
      properties:
        timestamp:
          type: string
          format: date-time
          example: '2026-11-13T10:30:00Z'
        status:
          type: integer
          format: int32
          example: 400
        error:
          type: string
          example: Bad Request
        message:
          type: string
          example: Invalid patient data
        path:
          type: string
          example: /patients/3fa85f64-5717-4562-b3fc-2c963f66afa6
